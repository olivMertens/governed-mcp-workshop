<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Workshop build board</title>
  <style>
    :root { color-scheme: light; --paper: #f5f8fd; --surface: #fff; --ink: #172c48; --muted: #526783; --line: #d5dfed; --blue: #0067b8; --indigo: #383ba4; --wash: #edf6fc; --gold: #ffe38c; --success: #14704b; --tip: #8a5d00; --error: #b32336; font-family: "Segoe UI", "Helvetica Neue", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.65; }
    a { color: var(--blue); text-underline-offset: 3px; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .skip { position: fixed; top: -80px; left: 20px; z-index: 5; padding: 10px; background: var(--surface); }
    .skip:focus { top: 12px; }
    .shell { display: grid; grid-template-columns: 255px minmax(0, 1fr); min-height: 100vh; }
    .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 30px 22px; background: var(--surface); border-right: 1px solid var(--line); }
    .brand { display: flex; gap: 12px; align-items: center; color: var(--ink); text-decoration: none; font-weight: 650; line-height: 1.3; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 44px; flex-shrink: 0; }
    .brand-mark svg { width: 40px; height: 44px; display: block; }
    .brand-text { display: block; }
    .brand-text .brand-azure { color: var(--blue); }
    .brand small { display: block; font-size: 12px; font-weight: 400; margin-top: 5px; color: var(--muted); }
    .nav-label { color: var(--muted); font-size: 12px; margin: 30px 10px 12px; }
    nav a { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; padding: 10px; border-radius: 8px; line-height: 1.3; font-size: 13px; margin-bottom: 4px; }
    nav a:hover { background: var(--paper); }
    nav a[aria-current="page"] { background: var(--wash); color: var(--blue); font-weight: 650; }
    .module-id { width: 28px; flex-shrink: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .nav-title { flex: 1; }
    .badge { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
    #start-nav a { display: flex; align-items: center; gap: 8px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .dot.validated { background: var(--success); }
    .dot.in-progress { background: var(--blue); }
    .dot.authored { background: var(--blue); outline: 1px solid var(--success); }
    .dot.blocked { background: var(--error); }
    .rail-footer { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 26px; font-size: 12px; color: var(--muted); }
    .stage { min-width: 0; }
    .toolbar { padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .refresh { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; white-space: nowrap; }
    #message { padding: 0 40px; margin: 0; font-size: 13px; }
    #message:not(:empty) { padding-top: 12px; }
    #message.error { color: var(--error); }
    main { max-width: 1120px; margin: auto; padding: 48px 40px 64px; }
    h1 { font-size: clamp(30px, 4.8vw, 58px); font-weight: 650; line-height: 1.08; letter-spacing: -.045em; max-width: 720px; margin: 0 0 24px; text-wrap: balance; }
    h2 { font-size: 24px; line-height: 1.25; letter-spacing: -.025em; margin: 32px 0 14px; }
    h3 { font-size: 18px; margin: 24px 0 12px; }
    .lead { max-width: 620px; font-size: 17px; color: var(--muted); margin-bottom: 26px; }
    .intro { display: flex; gap: 24px; align-items: flex-start; }
    .chapter { font-size: clamp(60px, 9vw, 100px); line-height: 1; letter-spacing: -.07em; color: var(--blue); font-weight: 300; }
    .intro h1 { font-size: clamp(28px, 3.8vw, 44px); margin-top: 4px; }
    .pill { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; margin-bottom: 12px; color: var(--muted); }
    .boundary { position: relative; margin: 36px 0 32px; background: var(--indigo); color: white; padding: 28px; border-radius: 4px 28px 4px 4px; }
    .boundary h2 { color: white; margin: 0 0 24px; font-size: 18px; }
    .chain { display: grid; grid-template-columns: 1fr 24px 1fr 24px 1fr; align-items: center; gap: 8px; }
    .node { min-height: 104px; padding: 16px; border: 1px solid #9294e2; background: #ffffff0d; }
    .node.gateway { border-color: var(--gold); color: var(--gold); }
    .node strong { display: block; font-size: 16px; }
    .node span { display: block; margin-top: 7px; font-size: 12px; color: #e4e5ff; }
    .connector { height: 1px; background: #b5b7f2; position: relative; }
    .connector::after { content: ""; width: 6px; height: 6px; border-top: 1px solid #b5b7f2; border-right: 1px solid #b5b7f2; transform: rotate(45deg); position: absolute; right: 0; top: -3px; }
    .boundary p { font-size: 12px; margin: 20px 0 0; color: #e4e5ff; }
    .primary { display: inline-flex; color: white; background: var(--blue); text-decoration: none; padding: 11px 18px; border-radius: 6px; font-weight: 600; }
    .notice { border-left: 3px solid var(--blue); background: var(--wash); padding: 16px 20px; margin: 24px 0; font-size: 14px; max-width: 760px; }
    .notice > strong { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .notice-body > :first-child { margin-top: 0; }
    .notice-body > :last-child { margin-bottom: 0; }
    .document blockquote { border-left: 3px solid var(--line); padding-left: 18px; margin: 20px 0; color: var(--muted); }
    .route-list { margin-top: 30px; border-top: 1px solid var(--line); }
    .route-item { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
    .route-item:hover .route-title { color: var(--blue); }
    .route-number { color: var(--blue); font-size: 24px; font-weight: 300; }
    .route-title { font-weight: 600; font-size: 15px; }
    .route-meta { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 3px; }
    .availability { color: var(--muted); font-size: 12px; }
    .document { background: var(--surface); border: 1px solid var(--line); padding: 12px 30px 28px; border-radius: 8px; overflow-wrap: anywhere; }
    .document p, .document li { max-width: 76ch; }
    /* Inside the step panel, text, questions, notes and results use the full panel width. */
    .lesson-page .document p, .lesson-page .document li, .lesson-page .notice, .lesson-page .result-box { max-width: none; }
    .lesson-page .screenshot img { max-width: 100%; }
    .document li { margin: 8px 0; }
    .document h1 { font-size: 30px; margin-top: 22px; }
    .document pre { padding: 18px; overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; line-height: 1.7; }
    code { font-family: Consolas, "SFMono-Regular", monospace; font-size: .9em; }
    :not(pre) > code { padding: 2px 4px; background: var(--wash); border-radius: 3px; }
    .table-scroll { overflow-x: auto; }
    table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
    td, th { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { font-weight: 600; }
    .source { font-size: 12px; color: var(--muted); margin: 20px 0; overflow-wrap: anywhere; }
    .pager { display: flex; justify-content: space-between; gap: 20px; margin-top: 32px; font-size: 14px; }
    .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 18px 0; }
    .secondary { display: inline-flex; padding: 10px 16px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; background: var(--surface); color: var(--ink); }
    .launch-panel { padding: 24px; margin: 24px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .launch-panel h2 { margin-top: 0; }
    .launch-panel p { max-width: 76ch; }
    .connection-label { display: block; font-weight: 600; margin-top: 20px; }
    .endpoint { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; }
    .field-message { margin: 8px 0 18px; color: var(--muted); font-size: 13px; }
    .field-message.error { color: var(--error); }
    .command { margin: 20px 0; min-width: 0; }
    .command-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; font-weight: 600; font-size: 13px; }
    .command pre { margin: 0; padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.7; }
    .copy { font-size: 12px; background: var(--surface); color: var(--blue); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; flex-shrink: 0; }
    .exercise { border-top: 2px solid var(--blue); padding-top: 4px; margin: 28px 0; }
    .quiz { border-top-color: #7650b3; }
    .check-work { margin: 28px 0 0; padding-top: 12px; }
    .check-work > h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
    .request-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
    .request-tabs[hidden] { display: none; }
    .request-tabs button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
    .request-tabs button > .step-num { width: 22px; height: 22px; font-size: 12px; background: var(--line); color: var(--ink); }
    .request-tabs button[aria-current="step"] { border-color: var(--blue); font-weight: 650; }
    .request-tabs button[aria-current="step"] > .step-num { background: var(--blue); color: #fff; }
    mark.change { background: var(--gold); color: #1b1b1b; border-radius: 3px; padding: 0 2px; }
    .change-legend mark { margin-right: 6px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 14px 0 20px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
    .card .card-kind { display: inline-block; margin-bottom: 4px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 12px; }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .card p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .page-map { margin: 22px 0 10px; }
    .page-map > p { margin: 0 0 10px; font-size: 14px; font-weight: 650; color: var(--muted); }
    .page-map ol { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0; padding: 0; }
    .page-map button { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
    .page-map button:hover, .page-map button:focus-visible { border-color: var(--blue); }
    .page-map button > strong { font-size: 15px; }
    .page-map button > small { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .page-map .optional > .step-num, .further-title > .step-num { background: var(--line); color: var(--ink); }
    .step-num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 14px; font-weight: 650; flex-shrink: 0; }
    .quiz .step-num { background: #7650b3; }
    .section-title { display: flex; align-items: center; gap: 10px; scroll-margin-top: 16px; }
    .useful-links { font-size: 14px; color: var(--muted); }
    .exchange { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; margin: 16px 0; }
    .exchange > div > .exchange-label { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-weight: 650; }
    .exchange-label > span { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: .85em; }
    .exchange .command, .exchange .result-box { margin-top: 0; }
    .lesson-page, .document { container-type: inline-size; }
    @container (max-width: 760px) { .exchange { grid-template-columns: minmax(0, 1fr); } }
    .quiz h2 .count { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--wash); color: var(--ink); font-size: 14px; font-weight: 650; }
    .quiz-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .quiz-list > li { padding: 16px 0; border-top: 1px solid var(--line); }
    .quiz-list > li > .document { background: none; border: 0; padding: 0; }
    .quiz-list p.question { margin: 0; }
    .quiz-list details.reveal { margin: 10px 0 0; }
    .quiz-list details.reveal[open] > summary { margin-bottom: 8px; }
    .quiz-list details.reveal .document { background: none; border: 0; border-left: 3px solid var(--line); border-radius: 0; padding: 2px 0 2px 16px; margin: 0 0 0 6px; }
    .quiz-list .quiz-jump { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .lesson-jump > svg { width: 1em; height: 1em; margin-left: 6px; vertical-align: -2px; color: #7650b3; }
    .exercise details { color: var(--ink); margin: 16px 0; }
    .exercise summary { font-weight: 600; font-size: 15px; }
    .exercise details .document { margin-top: 16px; }
    .lesson { margin: 24px 0; min-width: 0; }
    .lesson-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .lesson-position { color: var(--muted); font-size: 13px; margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .lesson-meter { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .lesson-meter span { display: block; height: 100%; background: var(--blue); }
    .lesson-page { margin-top: 18px; }
    .lesson-page h2 { margin-top: 0; }
    .lesson-page .command pre { max-height: 22rem; overflow-y: auto; }
    .lesson-nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .lesson-nav button { border: 0; font: inherit; max-width: 100%; text-align: left; display: inline-flex; align-items: center; gap: 8px; }
    .lesson-nav .symbol, .pager .symbol, .next-step .primary .symbol { width: 17px; height: 17px; }
    .pager a, .next-step .primary { display: inline-flex; align-items: center; gap: 8px; }
    .lesson-nav .secondary { border: 1px solid var(--line); }
    .lesson-nav .primary { margin-left: auto; }
    .lesson-nav button:disabled { opacity: .55; cursor: default; }
    .lesson-outline { margin-top: 18px; font-size: 14px; }
    .lesson-outline summary { font-size: 14px; }
    .lesson-outline ol { margin: 8px 0 0; padding-left: 24px; }
    .lesson-jump { padding: 4px 0; border: 0; background: none; color: var(--blue); text-align: left; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .lesson-jump[aria-current="step"] { color: var(--ink); font-weight: 650; text-decoration: none; }
    .lesson-jump[aria-current="step"]::after { content: " \2190"; color: var(--blue); }
    .services img, .services svg { flex-shrink: 0; }
    .toolbar-actions, .languages { display: flex; align-items: center; gap: 8px; }
    .languages button { padding: 5px 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--surface); font-size: 12px; }
    .languages button[aria-pressed="true"] { background: var(--wash); color: var(--blue); border-color: var(--blue); font-weight: 650; }
    .symbol { width: 19px; height: 19px; flex-shrink: 0; vertical-align: middle; }
    .notice.warning { border-left-color: #896300; }
    .notice.warning > strong { color: #896300; }
    .notice.caution { border-left-color: var(--error); }
    .notice.caution > strong { color: var(--error); }
    .notice.tip { border-left-color: var(--tip); }
    .notice.tip > strong { color: var(--tip); }
    .notice.important { border-left-color: #7650b3; }
    .notice.important > strong { color: #7650b3; }
    .notice.read-first > strong { color: var(--blue); }
    p.question { position: relative; border-left: 3px solid #7650b3; padding: 8px 12px 8px 40px; background: var(--wash); }
    p.question > svg { position: absolute; left: 12px; top: 10px; color: #7650b3; }
    details.answer > summary > svg { color: var(--tip); vertical-align: -3px; margin-right: 6px; }
    details.answer.reveal > summary > svg { color: var(--success); }
    .result-box .result-body > p:first-child > svg { vertical-align: -3px; margin-right: 6px; }
    .notice.read-first .secondary { margin-top: 12px; }
    .exercise > h2 { display: flex; align-items: center; gap: 10px; }
    .notice.note > strong { color: var(--blue); }
    .result-box { margin: 14px 0 24px; padding: 14px 18px; border: 1px solid var(--line); border-left: 4px solid var(--success); border-radius: 0 8px 8px 0; background: var(--surface); font-size: 14px; max-width: 820px; }
    .result-box.expected { border-left-color: var(--blue); }
    .result-body > :first-child { margin-top: 0; }
    .result-body > :last-child { margin-bottom: 0; }
    .result-body > p:first-child strong:first-child { color: var(--success); }
    .result-box.expected .result-body > p:first-child strong:first-child { color: var(--blue); }
    .result-body pre { margin: 10px 0; }
    .command.output .command-head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .notice p { margin: 6px 0 0; }
    .screenshot { margin: 18px 0; }
    .screenshot img { display: block; max-width: min(100%, 760px); height: auto; border: 1px solid var(--line); border-radius: 6px; }
    .screenshot figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .architecture { margin: 28px 0; min-width: 0; }
    .architecture h2 { margin-bottom: 8px; }
    .diagram-scroll { overflow-x: auto; border: 1px solid var(--line); background: #fff; }
    .diagram-scroll img { display: block; width: 100%; min-width: 900px; height: auto; }
    .architecture figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .next-step { margin-top: 32px; padding: 24px; border: 1px solid var(--line); background: var(--wash); border-radius: 8px; }
    .next-step h2 { margin-top: 0; }
    .workspace-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; margin: 18px 0; }
    .workspace-option { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; background: var(--surface); }
    .workspace-option strong, .workspace-option span { display: block; }
    .workspace-option span { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .brands { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin: 24px 0; font-size: 13px; }
    .product { display: inline-flex; align-items: center; gap: 8px; }
    .product img { width: 30px; height: 30px; object-fit: contain; padding: 2px; background: white; }
    details { margin-top: 24px; color: var(--muted); font-size: 13px; }
    summary { cursor: pointer; color: var(--ink); font-size: 15px; font-weight: 600; }
    details[open] > summary { margin-bottom: 16px; }
    details .document, .document details { font-size: 15px; }
    details p { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --paper: #172339; --surface: #1e2d45; --ink: #eef3ff; --muted: #b1c1db; --line: #405474; --blue: #8fbaff; --wash: #273f64; --success: #7cddb0; --tip: #f5c84c; --error: #ff9fa8; }
      :root:not([data-theme="light"]) .primary { background: #245ed2; color: #fff; }
      :root:not([data-theme="light"]) .notice.warning { border-left-color: #f5cd68; }
      :root:not([data-theme="light"]) .notice.warning > strong { color: #f5cd68; }
      :root:not([data-theme="light"]) .notice.important { border-left-color: #c9a9ff; }
      :root:not([data-theme="light"]) .notice.important > strong { color: #c9a9ff; }
      :root:not([data-theme="light"]) p.question { border-left-color: #c9a9ff; } :root:not([data-theme="light"]) p.question > svg { color: #c9a9ff; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --paper: #172339; --surface: #1e2d45; --ink: #eef3ff; --muted: #b1c1db; --line: #405474; --blue: #8fbaff; --wash: #273f64; --success: #7cddb0; --tip: #f5c84c; --error: #ff9fa8; }
    :root[data-theme="dark"] .primary { background: #245ed2; color: #fff; }
    :root[data-theme="dark"] .notice.warning { border-left-color: #f5cd68; }
    :root[data-theme="dark"] .notice.warning > strong { color: #f5cd68; }
    :root[data-theme="dark"] .notice.important { border-left-color: #c9a9ff; }
    :root[data-theme="dark"] .notice.important > strong { color: #c9a9ff; }

        const title = element("span", module.title, "route-title");
        title.append(element("span", module.module === "07" ? "Optional facilitator demo" : module.module === "99" ? "Remove workshop-owned resources" : labels[module.status], "route-meta"));
        const requires = dependencies[module.module]?.requires ?? [];
        if (requires.length) {
          const meta = element("span", undefined, "route-meta");
          meta.textContent = `${t("Requires modules:")} ${requires.join(", ")}`;
          title.append(meta);
        } else if (module.module === "99") title.append(element("span", "Run it last", "route-meta"));
        row.append(element("span", module.module, "route-number"), title,
          element("span", module.guide === null ? "Design outline" : "Participant guide", "availability"));
        route.append(row);
      }
      content.append(route);
    }
    function showModule(module) {
      const intro = element("div", undefined, "intro");
      const title = element("div");
      title.append(element("span", module.module === "07" ? "Optional / facilitator demo" : module.module === "99" ? "Cleanup" : "Workshop module", "pill"),
        element("h1", module.title));
      intro.append(element("span", module.module, "chapter"), title);
      // Microsoft product chips stay visible: they tell the reader at a glance which services this stage touches.
      content.append(intro, servicesList(module));
      const dependency = dependencyNotice(module);
      if (module.guide === null) content.append(notice("Design outline - participant guide not published.",
        "These are the planned outcomes and requirements. Do not treat them as deployment instructions. The complete steps, commands, validation and cleanup will appear here when the module README is added."));
      else {
        const first = readFirst[module.module];
        if (first) content.append(readFirstNotice(...first));
      }
      if (module.originalGuide) {
        content.append(notice("Important", "French participant guide not published. Read the original English guide before executing its commands."));
        const original = element("details");
        const body = markdown(module.originalGuide.content, module.originalGuide.sourcePath);
        body.lang = "en";
        original.append(element("summary", "Read the original English participant guide"),
          body);
        content.append(original);
      }
      const goTo = (target) => { target.scrollIntoView({ behavior: "smooth", block: "start" }); target.focus({ preventScroll: true }); };
      const guideTitle = element("h2", "Follow the guide", "section-title");
      guideTitle.tabIndex = -1;
      const furtherTitle = element("h2", "Architecture and context (optional)", "section-title further-title");
      furtherTitle.tabIndex = -1;
      const hintsBlock = () => {
        const hints = element("details", undefined, "answer");
        const hintTitle = element("summary", "Need a hint? Understand what this stage proves.");
        hintTitle.prepend(symbol("tip"));
        hints.append(hintTitle, markdown(module.hints, module.hintsSourcePath));
        return hints;
      };
      // Inside the guide's "Validate" step: the exact validator command (unless the step already shows it) and a hint.
      const validate = module.guide === null ? null : { render: (step) => {
        const block = element("div", undefined, "exercise check-work");
        const title = element("h3", "Check your work", "section-title");
        title.prepend(symbol("terminal"));
        block.append(title);
        if (module.module === "00") {
          block.append(element("p", "When every module 00 check prints PASS, review your Azure context, then open module 01.", "field-message"),
            link("Your Azure context", "#/deployment", "secondary"));
        } else {
          block.append(element("p", "Run the module validator in your own terminal. It checks the whole module and prints one PASS or FAIL line per check, with the expected HTTP status.", "field-message"));
          if (!/```(?:powershell|bash|sh)/.test(step.content)) block.append(validationCommands(module));
          const useful = element("p", undefined, "useful-links");
          useful.append(document.createTextNode(`${t("Useful links:")} `), link("Prepare a server test", "#/practice"));
          if (module.module !== "01") useful.append(document.createTextNode(" \u00b7 "), link("See your Azure results", "#/deployment"));
          block.append(useful);
        }
        block.append(hintsBlock());
        return block;
      } };
      // Module 00 checks the environment: no review questions there.
      const items = module.guide !== null && module.module !== "00" ? collectQuestions(module.guide) : [];
      let lesson = null;
      const review = items.length ? { render: (jump) => reviewList(items, module.sourcePath, jump,
        (original) => (original >= lesson.reviewIndex ? original + 2 : original + 1)) } : null;
      lesson = guidedDocument(module.guide ?? module.outline, module.sourcePath, null, { validate, review });
      // A short map tells a first-time reader what to do on this page, in which order.
      const map = element("nav", undefined, "page-map");
      map.setAttribute("aria-label", t("How this page works"));
      map.append(element("p", "How this page works"));
      const stops = element("ol");
      const stepWord = (number) => `${t("Step")} ${number}`;
      const cards = [[t("Follow the guide"), `${lesson.stepCount} ${t("steps, one at a time")}`, () => { lesson.goTo(0); }]];
      if (lesson.validateIndex !== -1) cards.push([t("Check your work"), `${stepWord(lesson.validateIndex + 1)}${language === "fr" ? " : " : ": "}${module.module === "00" ? t("Review your Azure context") : t("Run the validator: PASS or FAIL")}`, () => lesson.goTo(lesson.validateIndex)]);
      if (lesson.reviewIndex !== -1) cards.push([t("Review questions"), `${stepWord(lesson.reviewIndex + 1)}${language === "fr" ? " : " : ": "}${items.length} ${t("questions, answers hidden")}`, () => lesson.goTo(lesson.reviewIndex)]);
      cards.push([t("Architecture and context"), t("Optional: architecture, prerequisites, why it matters"), () => goTo(furtherTitle), true]);
      cards.forEach(([title, detail, action, optional], position) => {
        const stop = element("li");
        const button = element("button", undefined, optional ? "optional" : undefined);
        button.type = "button";
        button.append(element("span", String(position + 1), "step-num"), element("strong", title), element("small", detail));
        button.addEventListener("click", action);
        stop.append(button);
        stops.append(stop);
      });
      map.append(stops);
      content.insertBefore(map, content.children[2] || null);
      content.append(guideTitle, lesson);
      // Optional material comes after the lesson, so the main path reads strictly top to bottom.
      content.append(furtherTitle,
        disclosure("Architecture and security flow", architecture(module)));
      if (dependency) content.append(disclosure("Prerequisites", dependency));
      const concepts = element("details");
      concepts.append(element("summary", "Why this boundary matters"), markdown(module.learning, module.learningSourcePath),
        link("Read the full governance guide", "#/governance", "secondary"));
      content.append(concepts);
      if (module.guide !== null) content.append(pdfAction(`${module.module} / ${module.title}`, module.guide, module.sourcePath, () => servicesList(module)));
      const source = element("p", undefined, "source");
      source.append(document.createTextNode(language === "fr" ? "Fichier source : " : "Source: "), element("code", module.sourcePath));
      content.append(source);
      // Build status and evidence are for authors only: never shown on the published participant site.
      if (!staticSite) {
        const details = element("details");
        details.append(element("summary", "Repository build status and evidence"));
        if (language === "fr") details.append(element("p", "Original repository decisions and evidence remain in English."));
        details.append(element("p", `${t(labels[module.status])}${module.validatedOn ? ` / ${module.validatedOn}` : ""}`),
          element("p", module.evidence || "No validation evidence recorded."),
          element("p", module.notes || "No build notes."));
        content.append(details);
      }
      const index = state.modules.indexOf(module);
      const pager = element("nav", undefined, "pager");
      pager.setAttribute("aria-label", t("Previous and next module"));
      if (index > 0) {
        const target = module.module === "99" ? state.modules.find((item) => item.module === "06") : state.modules[index - 1];
        const previous = moduleLink(target);
        previous.replaceChildren(symbol("arrowLeft"), document.createTextNode(`${language === "fr" ? "Précédent" : "Previous"}${language === "fr" ? " :" : ":"} ${target.module} / ${target.title}`));
        pager.append(previous);
      } else pager.append(link("Workshop overview", "#/overview"));
      content.append(pager, nextStep(module));
    }
    function render(focus = false) {
      if (!state) return;
      content.replaceChildren();
      const route = location.hash || "#/start";
      // "#/concepts/10" opens the guided concepts page directly on its numbered section 10.
      const deep = /^#\/(concepts|governance|gettingStarted)\/(\d+)$/.exec(route);
      const documentKey = deep ? deep[1] : route.slice(2);
      const module = state.modules.find((item) => route === `#/module/${item.module}`);
      if (["#/start", "#/start/devcontainer", "#/start/local", "#/start/codespaces"].includes(route)) showStart(route.split("/")[2]);
      else if (module) showModule(module);
      else if (route === "#/practice") showPractice();
      else if (route === "#/decisions" && state.openDecisions) {
        content.append(element("h1", "Build decisions."),
          element("p", "Implementation choices still to resolve. These do not require participant input in this interface.", "lead"),
          markdown(state.openDecisions, "docs/PROGRESS.md"));
        if (language === "fr") content.prepend(notice("Note", "Original repository decisions and evidence remain in English."));
      } else if (Object.hasOwn(state.documents, documentKey)) {
        const doc = state.documents[documentKey];
        const guided = ["deployment", "presenter", "integration", "mcpServer", "tracks", "hosting", "gettingStarted", "concepts", "governance"].includes(documentKey);
        const body = guided ? guidedDocument(doc.content, doc.sourcePath, deep ? Number(deep[2]) : null) : markdown(doc.content, doc.sourcePath);
        if (language === "fr" && route.startsWith("#/original")) body.lang = "en";
        content.append(element("h1", doc.title), body);
        if (guided) content.append(pdfAction(doc.title, doc.content, doc.sourcePath));
      } else if (route === "#/overview" || route === "#content") overview();
      else {
        content.append(element("h1", "Page not found."),
          element("p", "Choose a module from the route, or return to the workshop overview."),
          link("Workshop overview", "#/overview", "primary"));
      }
      for (const anchor of document.querySelectorAll(".rail nav a")) {
        if (anchor.getAttribute("href") === (deep ? `#/${deep[1]}` : route)) {
          anchor.setAttribute("aria-current", "page");
          const group = anchor.closest(".nav-group");
          if (group) group.open = true;
        } else anchor.removeAttribute("aria-current");
      }
      document.title = `${content.querySelector("h1").textContent} | ${staticSite ? "Governed MCP on Azure" : "Workshop build board"}`;
      if (focus) content.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
    function activateLanguage() {
      document.documentElement.lang = language;
      if (rawState) state = language === "fr" ? { ...rawState, ...rawState.translations.fr } : rawState;
      for (const [selector, text] of [
        [".skip", "Skip to content"],
        [".toolbar > span", staticSite ? "Governed MCP / self-paced workshop" : "Workshop build board / self-paced guide"], ["#refresh", "Refresh content"],
      ]) document.querySelector(selector).textContent = t(text);
      const tagline = document.querySelector(".brand small");
      const [before, after = ""] = t("A hands-on Azure workshop").split("Azure");
      const azure = element("span", "Azure", "brand-azure");
      tagline.replaceChildren(document.createTextNode(before), azure, document.createTextNode(after));
      const captions = document.querySelectorAll(".nav-label");
      captions[0].textContent = t("Start");
      captions[1].textContent = t("Main route");
      document.querySelector(".rail-footer").textContent = staticSite ?
        t("Read the steps. Run in your own environment. No credentials or deployment in this website.") :
        language === "fr" ? "Interface Copilot en Preview. Suivez les étapes et vérifiez chaque module avant de poursuivre." :
          "Copilot canvas SDK: Preview. Read the steps. Run locally. Validate before continuing.";
      for (const [id, text] of [["start-nav", "Start here"], ["module-nav", "Workshop modules"], ["resource-nav", "Workshop references"], ["author-nav", "Facilitators and authors"], ["content", "Workshop content"]]) {
        document.getElementById(id).setAttribute("aria-label", t(text));
      }
      function navLink(route, title, icon) {
        const anchor = link("", `#/${route}`);
        anchor.title = t(title);
        anchor.append(symbol(icon), element("span", title, "nav-text"));
        return anchor;
      }
      const starts = document.getElementById("start-nav");
      starts.replaceChildren(navLink("start", "Choose your workspace", "terminal"),
        navLink("concepts", "MCP and agent concepts", "book"), navLink("overview", "Workshop overview", "home"));
      for (const code of ["en", "fr"]) document.getElementById(`language-${code}`).setAttribute("aria-pressed", String(language === code));
      for (const [group, nav, title, icon, entries] of [
        ["resource-group", "resource-nav", "Resources", "book", [
          ["practice", "Try your MCP", "terminal"],
          ...(state?.documents.tracks ? [["tracks", "Choose your track", "layers"]] : []),
          ...(state?.documents.mcpServer ? [["mcpServer", "The MCP server and its answers", "layers"]] : []),
          ["deployment", "Your Azure context", "shield"],
          ["governance", "Understand governance", "important"], ["architecture", "Architecture, step by step", "layers"],
          ["sources", "Verified sources", "link"],
        ]],
        ["author-group", "author-nav", "Facilitators and authors", "people", [
          ...(state?.documents.presenter ? [["presenter", "Presenter guide", "people"]] : []),
          ...(state?.documents.integration ? [["integration", "Session 2: integrate and expose MCP", "layers"]] : []),
          // Build runbook and open decisions are authoring tools: local board only, never on the published site.
          ...(staticSite ? [] : [["runbook", "Build runbook", "route"], ["decisions", "Build decisions", "flag"]]),
          ["hosting", "Publish or host the guides", "globe"],
        ]],
      ]) {
        const summary = document.querySelector(`#${group} > summary`);
        summary.replaceChildren(symbol(icon), element("span", title, "nav-text"));
        summary.title = t(title);
        document.getElementById(nav).replaceChildren(...entries.map((entry) => navLink(...entry)));
      }
      updateChrome();
      const nav = document.getElementById("module-nav");
      nav.replaceChildren();
      for (const module of state?.modules || []) {
        const anchor = link("", `#/module/${module.module}`);
        anchor.setAttribute("aria-label", `Module ${module.module}: ${module.title}`);
        anchor.title = `${module.module} / ${module.title}`;
        anchor.append(element("span", module.module, "module-id"), element("span", module.title, "nav-title"));
        const note = module.module === "07" ? "Optional" : module.module === "99" ? "Always" : "";
        if (note) anchor.append(element("span", t(note), "badge"));
        const dot = element("span", undefined, `dot ${module.status}`);
        dot.setAttribute("aria-hidden", "true");
        dot.title = t(labels[module.status]);
        anchor.append(dot);
        nav.append(anchor);
      }
    }
    async function refresh() {
      if (loading) return;
      loading = true;
      const button = document.getElementById("refresh");
      button.disabled = true;
      message.className = "";
      message.textContent = t("Loading workshop content...");
      try {
        const response = staticSite ? await fetch("journey.json") :
          await fetch("/journey", { headers: { "x-board-key": key } });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Content request failed (${response.status}).`);
        if (!result.translations?.fr) throw new Error("French workshop content is unavailable.");
        rawState = result;
        if (staticSite && !participantChecked) {
          participantChecked = true;
          // Only a participant-owned portal serves this file; GitHub Pages returns 404 and the page stays manual.
          try {
            const hints = await fetch("participant.json", { cache: "no-store" });
            if (hints.ok && hints.headers.get("content-type")?.startsWith("application/json")) {
              const value = await hints.json();
              if (typeof value?.mcpEndpoint === "string") participant = value;
            }
          } catch { participant = null; }
        }
        activateLanguage();
        render();
        message.textContent = "";
      } catch (error) {
        message.className = "error";
        const recovery = staticSite ? t("Use Refresh content to retry. If it persists, contact the site maintainer.") :
          language === "fr" ? "Utilisez Actualiser pour réessayer. Consultez le journal de l'extension si l'erreur persiste." :
            "Use Refresh content to retry. If it persists, inspect the extension log.";
        message.textContent = `${error.message} ${recovery}`;
        if (!state) {
          content.replaceChildren(element("h1", "Content is unavailable."),
            element("p", staticSite ? "The published workshop content could not be loaded. No credentials are needed." :
              "The local workshop documents could not be loaded. No progress has been changed."));
        }
      } finally {
        loading = false;
        button.disabled = false;
      }
    }
    document.getElementById("refresh").addEventListener("click", refresh);
    for (const code of ["en", "fr"]) document.getElementById(`language-${code}`).addEventListener("click", () => {
      if (language === code) return;
      language = code;
      const url = new URL(location.href);
      url.searchParams.set("lang", code);
      history.pushState(null, "", url);
      activateLanguage();
      render(true);
      message.textContent = "";
    });
    document.querySelector(".skip").addEventListener("click", (event) => {
      event.preventDefault();
      content.focus();
    });
    window.addEventListener("hashchange", () => render(true));
    const shell = document.querySelector(".shell");
    function systemDark() { return window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false; }
    const themeChoices = [
      ["template", "Template", "Original layout, system colors"],
      ["light", "White", "White surfaces, Azure accents"],
      ["dark", "Dark", "Dark surfaces, Azure accents"],
    ];
    function updateAppearance() {
      const selected = document.documentElement.dataset.theme || "template";
      for (const button of document.querySelectorAll("[data-theme-choice]")) {
        button.setAttribute("aria-pressed", String(button.dataset.themeChoice === selected));
      }
      for (const node of document.querySelectorAll("[data-appearance-label]")) node.textContent = t(node.dataset.appearanceLabel);
      document.getElementById("appearance-close").setAttribute("aria-label", t("Close appearance settings"));
    }
    function setTheme(value) {
      if (!themeChoices.some(([key]) => key === value)) throw new Error("Unknown appearance template.");
      if (value === "template") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = value;
      preferences.set("theme", value);
      updateChrome();
    }
    function createAppearanceDialog() {
      const dialog = element("dialog", undefined, "appearance-dialog");
      dialog.id = "appearance-dialog";
      dialog.setAttribute("aria-labelledby", "appearance-title");
      dialog.setAttribute("aria-describedby", "appearance-description");
      const heading = element("div", undefined, "appearance-head");
      const brands = element("div", undefined, "appearance-brands");
      for (const [name, asset] of [["Microsoft", "microsoft"], ["Azure", "azure"]]) {
        const product = element("span", undefined, "product");
        product.append(productIcon(asset), document.createTextNode(name));
        brands.append(product);
      }
      const close = element("button", undefined, "icon-button");
      close.id = "appearance-close";
      close.type = "button";
      close.append(document.createTextNode("\u00d7"));
      close.addEventListener("click", () => dialog.close());
      heading.append(brands, close);
      function label(tag, text, id) {
        const node = element(tag);
        node.dataset.appearanceLabel = text;
        if (id) node.id = id;
        return node;
      }
      const options = element("div", undefined, "theme-options");
      options.setAttribute("role", "group");
      options.setAttribute("aria-labelledby", "appearance-title");
      for (const [key, title, description] of themeChoices) {
        const button = element("button", undefined, "theme-option");
        button.type = "button";
        button.dataset.themeChoice = key;
        const swatch = element("span", undefined, `theme-swatch ${key === "light" ? "white" : key}`);
        swatch.setAttribute("aria-hidden", "true");
        button.append(swatch, label("strong", title), label("small", description));
        button.addEventListener("click", () => setTheme(key));
        options.append(button);
      }
      dialog.append(heading, label("h2", "Appearance", "appearance-title"),
        label("p", "Choose a template. Your preference stays in this browser.", "appearance-description"),
        options, label("p", "Independent training. Product marks identify technologies, not endorsement."));
      document.body.append(dialog);
      return dialog;
    }
    const appearanceDialog = createAppearanceDialog();
    function updateChrome() {
      const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : systemDark();
      const theme = document.getElementById("theme-toggle");
      const themeLabel = t("Choose appearance");
      theme.replaceChildren(symbol(dark ? "sun" : "moon"));
      theme.setAttribute("aria-label", themeLabel);
      theme.title = themeLabel;
      updateAppearance();
      const collapsed = shell.classList.contains("collapsed");
      const rail = document.getElementById("rail-toggle");
      const railLabel = t(collapsed ? "Expand menu" : "Collapse menu");
      rail.replaceChildren(symbol(collapsed ? "expand" : "collapse"));
      rail.setAttribute("aria-label", railLabel);
      rail.setAttribute("aria-expanded", String(!collapsed));
      rail.title = railLabel;
    }
    function setCollapsed(collapsed) {
      shell.classList.toggle("collapsed", collapsed);
      preferences.set("rail", collapsed ? "collapsed" : "expanded");
      updateChrome();
    }
    const savedTheme = preferences.get("theme");
    if (savedTheme === "dark" || savedTheme === "light") document.documentElement.dataset.theme = savedTheme;
    if (preferences.get("rail") === "collapsed") shell.classList.add("collapsed");
    document.getElementById("theme-toggle").addEventListener("click", () => {
      appearanceDialog.showModal();
    });
    document.getElementById("rail-toggle").addEventListener("click", () => setCollapsed(!shell.classList.contains("collapsed")));
    for (const group of document.querySelectorAll(".nav-group")) {
      group.querySelector("summary").addEventListener("click", (event) => {
        if (!shell.classList.contains("collapsed")) return;
        // In icon-only mode, a group icon reopens the full menu with that group expanded.
        event.preventDefault();
        group.open = true;
        setCollapsed(false);
      });
    }
    window.addEventListener("popstate", () => {
      language = new URL(location.href).searchParams.get("lang") === "fr" ? "fr" : "en";
      activateLanguage();
      render(true);
    });
    activateLanguage();
    refresh();
  </script>
</body>
</html>
